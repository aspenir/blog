<!DOCTYPE html>
<html lang="{{- site.Language.Lang -}}">

    <head>
        {{- partial "head.html" . -}}
    </head>

    <body>
    <!-- Top-level Reading Progress Indicator Bar -->
    <div id="reading-progress" style="position: fixed; top: 0; left: 0; width: 0%; height: 2px; background-color: var(--base0D); z-index: 9999; transition: width 0.1s ease-out;"></div>

        <div class="page">

            <header class="page__header">
                {{- partial "header.html" . -}}
            </header>

            <section class="page__body">
                {{- block "main" . }}{{- end }}
            </section>

            <section class="page__aside">
                <div class="aside__about">
                    {{- partial "about.html" . -}}
                </div>
            </section>

            <footer class="page__footer">
                {{- partial "footer.html" . -}}
            </footer>

        </div>
    </body>

</html>

baseURL = 'https://aspenir.github.io/blog/'
locale = 'en-us'
title = 'Aspenir'
theme = "colthree"
relativeURLs = true
canonifyURLs = true
[params]
  mainSections = ["/"]

[menu]
  [[menu.main]]
    name = 'Home'
    url = './'
    weight = 10

  [[menu.main]]
    name = 'About'
    url = 'about/'
    weight = 20

  [[menu.main]]
    name = 'Tags'
    url = 'tags/'
    weight = 30


[markup]
  [markup.highlight]
    noClasses = false  # Tells Hugo to use CSS classes instead of inline color declarations
    style = "dracula"  # Or your preferred color scheme palette (monokai, github-dark, etc)

[caches]
  [caches.images]
    dir = ':cacheDir/images'


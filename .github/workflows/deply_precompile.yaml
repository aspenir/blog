name: Deploy Pre-compiled Site

on:
  push:
    branches:
      - master # Or change to your primary branch name (e.g. master) if different
  workflow_dispatch:

# Grant permissions required for GitHub Pages deployments
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Pages Asset Pipeline
        uses: actions/configure-pages@v5

      - name: Upload Static Web Assets From Public Directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
